<div class="research-grid">{% for project in site.data.research %}<a class="research-card" href="{{ project.url | relative_url }}"><div class="project-art {{ project.class }}" aria-hidden="true"><span class="art-number">{{ project.number }}</span>{% if project.class == 'cells' %}<i></i><i></i><i></i><i></i><i></i>{% elsif project.class == 'tracks' %}<i></i><i></i><i></i><i></i><i></i><i></i>{% else %}<i></i><i></i><i></i><i></i><i></i>{% endif %}<span class="art-arrow">↗</span></div><div class="card-copy"><p class="small-label">{{ project.category }}</p><h3>{{ project.title }}</h3><p>{{ project.description }}</p></div></a>{% endfor %}</div>
